# Автотриаж открытых issues.
#
# Запускается на события issues (opened, reopened) и прогоняет скилл triage
# (вендорен в .opencode/skills/triage/) по новому issue: категория
# (bug|enhancement), state-лейбл из пятиролевого словаря, при необходимости —
# вопросы к автору. Код не меняется, PR не открываются.
#
# Фильтры (jobs.triage.if):
#   - только доверенные авторы: OWNER / MEMBER / COLLABORATOR;
#   - боты пропускаются (user.type != 'Bot');
#   - issue с любым state-лейблом (needs-triage|needs-info|ready-for-agent|
#     ready-for-human|wontfix) пропускается — тикеты, подготовленные скиллами
#     (to-spec/to-tickets ставят ready-for-agent), повторно не разбираются.
#
# Ограничения:
#   - глобальный concurrency-группа auto-triage: максимум 1 параллельный
#     прогон, остальные события ждут в очереди (cancel-in-progress: false);
#   - timeout-minutes: 40 на job.

name: auto-triage

on:
  issues:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: auto-triage
  cancel-in-progress: false

jobs:
  triage:
    if: |
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      github.event.issue.user.type != 'Bot' &&
      !contains(toJson(github.event.issue.labels.*.name), '"needs-triage"') &&
      !contains(toJson(github.event.issue.labels.*.name), '"needs-info"') &&
      !contains(toJson(github.event.issue.labels.*.name), '"ready-for-agent"') &&
      !contains(toJson(github.event.issue.labels.*.name), '"ready-for-human"') &&
      !contains(toJson(github.event.issue.labels.*.name), '"wontfix"')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run triage agent
        uses: anomalyco/opencode/github@latest
        env:
          # Ключ opencode zen (секрет OPENCODE_API_KEY). Для -free моделей не
          # обязателен, но даёт полноценную авторизацию zen и открывает платные
          # модели каталога через vars.OPENCODE_MODEL.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Встроенный GITHUB_TOKEN run'а: лейблы и комментарии триажа.
          # Job-level permissions выше выдают issues: write.
          GH_TOKEN: ${{ github.token }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/glm-5.3-flash-free' }}
          prompt: |
            Автотриаж issue #${{ github.event.issue.number }} репозитория
            ${{ github.repository }} по скиллу triage (вендорен в
            .opencode/skills/triage/). Событие: ${{ github.event.action }}.

            Жёсткие правила:
            - НЕ менять код, НЕ открывать PR — работать только с трекером
              (чтение репозитория, issue, комментарии, лейблы).
            - Каждый комментарий начинать с дисклеймера
              "> *This was generated by AI during triage.*"
            - Результат: ровно один category-лейбл (bug|enhancement) и ровно
              один state-лейбл из пятиролевого словаря (needs-triage|
              needs-info|ready-for-agent|ready-for-human|wontfix); маппинг
              ролей на строки лейблов — docs/agents/triage-labels.md.
            - Перед рекомендацией выполнить обе проверки скилла: redundancy
              (поиск существующей реализации по доменному термину из
              GLOSSARY.md, не по формулировке issue) и prior rejection
              (.out-of-scope/).
            - Роль needs-info: задать все недостающие вопросы ОДНИМ
              комментарием — НЕ гриллить интерактивно (мейнтейнера в этом
              прогоне нет).
            - Роль ready-for-agent: приложить agent brief по образцу скилла.
            - Если на issue уже есть любой state-лейбл — немедленно завершиться
              без единого действия (идемпотентность в глубину защиты от
              повторного разбора тикетов, подготовленных скиллами).
