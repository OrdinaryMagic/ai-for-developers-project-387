name: CI

# Run all project checks on every push (branches + tags).
# Hexlet's own check workflow lives in hexlet-check.yml and stays untouched.

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

jobs:
  check:
    name: Project checks (mise run check)
    runs-on: ubuntu-latest
    steps:
      # Cart #42 / ticket #49 — gitleaks-action@v2 по умолчанию сканирует
      # git diff `HEAD~1..HEAD` (с `--first-parent`). actions/checkout@v7
      # по умолчанию делает `fetch-depth: 1`, поэтому HEAD~1 в локальном
      # clone отсутствует → action падает в ошибку "ambiguous argument".
      # Передаём `fetch-depth: 0`, чтобы полная история была доступна.
      # Это добавляет ~1-2 секунды к checkout, но без него CI gitleaks
      # step падает с partial-scan.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads mise.toml, installs the pinned versions of the tools (Node 22.23.4,
      # hk, npm:@commitlint/cli) and runs the postinstall hook which does
      # root `npm install` and `hk install` (git hooks). Web dependencies are
      # installed explicitly below. Built-in cache keeps the
      # tool-install layer fast.
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: ""

      # Cart #42 / ticket #49 — сканируем историю репо на secret'ы
      # ДО всех остальных проверок, чтобы утечка токенов была caught
      # раньше regeneration-шагов, которые могут промаскировать fail-fast.
      #
      # Action `gitleaks/gitleaks-action@v2` (см. https://github.com/gitleaks/gitleaks-action)
      # оборачивает released binary gitleaks (8.18.4 совпадает с pin в
      # mise.toml/hk.pkl после cart-#42 wave-2). Конфиг читается из
      # `.gitleaks.toml` автоматически (см. тикет #47).
      #
      # `upload: false` потому что Code Scanning / SARIF upload ещё не
      # включены — research notes §5 рекомендуют opt-in позже.
      - name: Scan repo for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lockfile-проверка для обоих независимых npm-пакетов. mise postinstall
      # ставит только root-зависимости, поэтому web нужен отдельный npm ci.
      - name: Install root npm deps
        run: npm ci --no-audit --no-fund

      - name: Install web workspace deps
        run: npm ci --prefix web --no-audit --no-fund

      # Browser cache и установка Chromium остаются в canonical check-job:
      # `mise run check` ниже сам запускает Playwright как часть полного gate.
      - name: Restore Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browsers (chromium)
        run: npm run test:e2e:install

      # TypeSpec → OpenAPI регенерируется перед всеми проверками. Если
      # закоммиченный openapi.yaml отличается от того, что генерируется из
      # spec/*.tsp, CI падает — значит, кто-то отредактировал openapi.yaml
      # руками или не перегенерировал после правки схемы (см. AGENTS.md rule
      # #9 про generated файлы).
      - name: Regenerate OpenAPI and verify it is up-to-date
        run: |
          mise run spec
          if ! git diff --exit-code openapi.yaml > /dev/null; then
            echo "::error::openapi.yaml is out of date — regenerated from spec/ differs from committed."
            git --no-pager diff --no-color openapi.yaml
            exit 1
          fi

      # openapi.yaml → single-file Orval SDK (API-типы + fetch endpoint-функции).
      # Шаг бежит ПОСЛЕ Regenerate OpenAPI, чтобы любой drift из spec/*.tsp уже
      # был зафиксирован в openapi.yaml. Если закоммиченный web/src/api/sdk.ts
      # отличается от результата pinned `mise run gen:sdk`, CI падает — см.
      # AGENTS.md rules #9–11 (SDK is a generated artifact and the only web runtime).
      - name: Regenerate SDK and verify it is up-to-date
        run: |
          mise run gen:sdk
          if ! git diff --exit-code web/src/api/sdk.ts > /dev/null; then
            echo "::error::web/src/api/sdk.ts is out of date — regenerated from openapi.yaml differs from committed."
            git --no-pager diff --no-color web/src/api/sdk.ts | head -200
            exit 1
          fi

      - name: Run all project checks
        env:
          CI: "1"
          E2E_API_PORT: "3030"
        run: mise run check

      # Единый upload для любого падения check-job; отсутствующие артефакты
      # на ранних шагах не маскируют исходную ошибку.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Cart #42 / ticket #46 — билдим Dockerfile-образ на каждый push и
  # прогоняем smoke-чек против поднятого контейнера. Это страховка от
  # drift'а между `npm run build` (на котором стоит `mise run check`) и
  # реальным образом: `tsc` компилирует dist/, но только в Docker
  # срабатывают runtime ENV'и (`HOST=0.0.0.0`, prod-only deps,
  # `CMD ["node", "dist/server.js"]`).
  #
  # `needs: check` — Docker smoke запускается только после полного project
  # gate: backend/web checks, production-сборки web и Playwright e2e.
  docker:
    name: Build Docker image + smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # mise ставит те же тулзы, что и в check ([tools] в mise.toml:
      # node 22.23.4, hk, commitlint). Кэш jdx/mise-action переиспользует
      # слой установки инструментов между job'ами.
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: ""

      # BuildKit ≥ 23.0 даёт нам inline cache и `load` через buildx. GH
      # Actions runner уже имеет buildx-демон под капотом — этот step
      # переключает на него.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Билдим образ из root Dockerfile. Тег `booking-api:ci` — internal,
      # в registry не пушим (Deploy — отдельная карта #52). `cache-from`
      # и `cache-to: type=gha,mode=max` — это GitHub Actions layer cache
      # (скрытый GHA-volume): холодный первый push ~2 мин; с прогретым
      # кэшем — инкрементальный за ~10–30 с.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: booking-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Поднимаем контейнер в фоне на фиксированном 3030. `--env PORT=3030`
      # перебивает `ENV PORT=3000` из Dockerfile; `--publish 3030:3030`
      # биндит порт loopback'ом (без `0.0.0.0`-экспозиции в общую сеть
      # runner'а). После старта — цикл поллинга `/health` до 30 с, потом
      # основные smoke-curl'ы. `curl -fsS` падает на non-2xx, поэтому
      # на 5xx / connection refused задача падает без отдельного `set -e`.
      - name: Run container and smoke-test
        run: |
          docker run --name booking-api-ci \
            --detach \
            --env PORT=3030 \
            --publish 3030:3030 \
            booking-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3030/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3030/health | tee /tmp/health.json
          curl -fsS http://127.0.0.1:3030/ | tee /tmp/root.json
          # Cart #42 / ticket #46 — spec требует smoke по `/meeting-types`
          # в дополнение к `/` и `/health`. 200 ожидается на свежем
          # in-memory store (см. `src/routes/meeting-types.ts:51`).
          curl -fsS http://127.0.0.1:3030/meeting-types | tee /tmp/meeting-types.json

      # Чистим контейнер на любом исходе задачи — даже если smoke-curl
      # упал и job красится красным. `|| true` гасит ненулевой exit,
      # чтобы шаг cleanup никогда не маскировал настоящую ошибку.
      - name: Cleanup
        if: always()
        run: docker rm -f booking-api-ci || true
