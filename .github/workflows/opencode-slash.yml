# Вызов OpenCode-agentа из комментариев к issue и review-комментариев PR.
#
# Поддерживаемые команды в теле комментария:
#   /oc <prompt>
#   /opencode <prompt>
#
# Пример:
#   /oc запусти скилл to-spec по обсуждению этого issue
#
# Требования:
#   - секрет OPENCODE_API_KEY (или провайдер, настроенный для выбранной model);
#   - workflow срабатывает только для OWNER / MEMBER / COLLABORATOR.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
      reactions: write
    steps:
      - name: React with eyes
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # Имя секрета зависит от провайдера, выбранного в model.
          # Для opencode/mimo-v2.6-flash-free используется OPENCODE_API_KEY.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
