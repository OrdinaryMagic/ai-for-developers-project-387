# Вызов OpenCode-agentа из комментариев к issue и review-комментариев PR.
#
# Поддерживаемые команды в теле комментария:
#   /oc <prompt>
#   /opencode <prompt>
#
# Пример:
#   /oc запусти скилл to-spec по обсуждению этого issue
#
# Требования:
#   - секрет LITELLM_URL и LITELLM_API_KEY;
#   - workflow срабатывает только для OWNER / MEMBER / COLLABORATOR.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # LiteLLM proxy endpoint и ключ. Модель выбирается через vars.OPENCODE_MODEL;
          # если не задана — используется litellm/MiniMax-M3.
          # В secrets.LITELLM_URL должен быть полный URL с /v1, например:
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
          # OpenAI-compatible provider ожидает ключ в OPENAI_API_KEY.
          # Значение берётся из секрета LITELLM_API_KEY.
          OPENAI_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'litellm/MiniMax-M3' }}
