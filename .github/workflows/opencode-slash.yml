# Вызов OpenCode-agentа из комментариев к issue и review-комментариев PR.
#
# Поддерживаемые команды в теле комментария:
#   /oc <prompt>
#   /opencode <prompt>
#
# Пример:
#   /oc запусти скилл to-spec по обсуждению этого issue
#
# Требования:
#   - дефолтная модель opencode/glm-5.3-flash-free (каталог opencode zen) работает
#     без секретов и без конфигурации провайдера;
#   - секрет OPENCODE_API_KEY (ключ opencode zen) — опционально: авторизация zen
#     и доступ к платным моделям каталога через vars.OPENCODE_MODEL;
#   - workflow срабатывает только для OWNER / MEMBER / COLLABORATOR.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # Ключ opencode zen (секрет OPENCODE_API_KEY). Для -free моделей не
          # обязателен, но даёт полноценную авторизацию zen и открывает платные
          # модели каталога через vars.OPENCODE_MODEL.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Встроенный GITHUB_TOKEN run'а: даёт gh CLI в агенте права на запись
          # в issues/PR (создание sub-tickets, лейблы, комментарии). Job-level
          # permissions выше выдают issues: write и pull-requests: write.
          GH_TOKEN: ${{ github.token }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/glm-5.3-flash-free' }}
