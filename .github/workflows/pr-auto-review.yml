# Автоматическое ревью pull requests.
#
# Запускается на события pull_request (opened, synchronize, reopened) и
# прогоняет OpenCode-агента по критериям из REVIEW.md в корне репозитория.
# Агент сравнивает diff PR с критериями и публикует GitHub Review с
# вердиктом (COMMENT / REQUEST_CHANGES) и дисклеймером. Код не меняется.
#
# Независим от ci.yml: качество кода и ревью — ортогональные проверки,
# ревью не блокирует merge (информативный вердикт для мейнтейнера).
#
# Фильтры (jobs.review.if):
#   - только доверенные авторы: OWNER / MEMBER / COLLABORATOR;
#   - боты пропускаются (user.type != 'Bot') — release-please PR не ревьюятся;
#   - draft-PR не ревьюятся до готовности;
#   - PR с лейблом no-auto-review пропускается (ручной секьюз мейнтейнера).
#
# Пределы запусков до вызова модели:
#   - paths-ignore на триггере: PR с изменениями только в markdown-документации
#     (**.md, docs/**) не запускают воркфлоу вообще — ни runner, ни модель;
#
# Ограничения:
#   - concurrency-группа на PR с cancel-in-progress: true: новый push
#     отменяет ревью по устаревшему SHA — в PR не остаётся ревью неактуального
#     состояния кода;
#   - timeout-minutes: 15 на job;
#   - permissions: только чтение кода и запись ревью в PR.

name: pr-auto-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Предел до вызова модели: PR с изменениями только в markdown-документации
    # не запускают воркфлоу вообще. PR «код + попутная правка README»
    # ревьюятся как обычно.
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions: {}

concurrency:
  group: pr-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.draft == false &&
      !contains(toJson(github.event.pull_request.labels.*.name), '"no-auto-review"')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run review agent
        uses: anomalyco/opencode/github@latest
        env:
          # Ключ opencode zen (секрет OPENCODE_API_KEY). Для -free моделей не
          # обязателен, но даёт полноценную авторизацию zen и открывает платные
          # модели каталога через vars.OPENCODE_MODEL.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Встроенный GITHUB_TOKEN run'а: публикация GitHub Review в PR.
          # Job-level permissions выше выдают pull-requests: write.
          GH_TOKEN: ${{ github.token }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/glm-5.3-flash-free' }}
          prompt: |
            Авторевью PR #${{ github.event.pull_request.number }} репозитория
            ${{ github.repository }} по критериям из REVIEW.md в корне
            репозитория. Событие: ${{ github.event.action }}.

            Жёсткие правила:
            - НЕ менять код, НЕ пушить коммиты — только чтение репозитория и
              публикация ревью в PR через gh CLI.
            - Сначала прочитать REVIEW.md — это полный список критериев;
              проверить diff PR против каждого пункта.
            - Результат — GitHub Review на HEAD PR (gh pr review) с вердиктом:
              REQUEST_CHANGES при нарушении секций Spec/Standards REVIEW.md
              или риске уровня «сломает прод», иначе COMMENT (включая
              случай «замечаний нет» — короткое approve-оформление COMMENT).
            - Каждое нарушение — со ссылкой на файл и строку diff; молчание
              по пункту = пункт прошёл.
            - Начать ревью с дисклеймера:
              "> *This was generated by AI during automated review.*"
            - Ревью одно, сводное: не плодить отдельные комментарии-потоки.
