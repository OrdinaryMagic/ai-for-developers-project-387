#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true

[tools]
node = "22.23.4"
hk = "2.11.0"
"npm:@commitlint/cli" = "latest"
gitleaks = "8.18.4"

[env]
NODE_ENV = "development"
HOST = "127.0.0.1"
PORT = "3000"

[tasks.dev]
description = "API dev server with tsx watch"
run = "npm run dev"

[tasks.build]
description = "Compile TypeScript to dist/"
run = "npm run build"

[tasks.start]
description = "Build and run the API (production)"
depends = ["build"]
run = "npm run start"

[tasks.spec]
description = "Compile TypeSpec to dist/openapi.yaml"
run = "npx tsp compile spec/main.tsp"

[tasks."gen:sdk"]
description = "Regenerate single-file Orval fetch SDK in web/src/api/sdk.ts from openapi.yaml"
depends = ["spec"]
run = "npx --no-install orval --config ./orval.config.ts && npx --no-install oxfmt ./web/src/api/sdk.ts"

[tasks.test]
description = "Run vitest once"
run = "npm run test"

[tasks.lint]
description = "Run oxlint"
run = "npm run lint"

[tasks.format]
description = "Format with oxfmt"
run = "npm run format"

[tasks.typecheck]
description = "Type-check without emitting"
run = "npm run typecheck"

[tasks.check]
description = "Full project gate: backend/web checks, web production build and Playwright e2e (fail-fast, sequential)"
run = "npm run typecheck && npm run typecheck:web && npm run lint && npm run format:check && npm run test && npm run test:web && npm run build:web && npm run test:e2e"

# --- mise hooks: environment events ---

# after mise installs project tools, install npm dependencies and hk git hooks
[hooks]
postinstall = ["npm install", "hk install"]

# re-install npm dependencies when package.json changes in an activated shell
[[watch_files]]
patterns = ["package.json"]
run = "npm install"

# --- mise daemons: background dev processes ---

# background dev server: `mise daemons start api` (requires pitchfork)
[daemons.api]
run = "exec npm run dev"
ready_port = 3000
